<title>Inferrix Cortex Feature Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --paper:#fbfbfd; --surface:#ffffff; --sunken:#f3f3f8;
  --ink:#14151f; --body:#2c2e3d; --muted:#6a6d82;
  --rule:#e2e3ec; --rule-soft:#eeeef4;
  --brand:#2b388f; --brand-soft:#eaecf7; --brand-ink:#2b388f;
  --signal:#ec1c24; --signal-soft:#fdeced; --signal-ink:#b3151b;
  --code-bg:#f2f2f8; --code-ink:#33355a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e0f16; --surface:#161825; --sunken:#1c1e2c;
    --ink:#eceef7; --body:#c4c7d8; --muted:#8b8fa6;
    --rule:#282b3d; --rule-soft:#20222f;
    --brand:#93a0ec; --brand-soft:#1b2040; --brand-ink:#a8b3f2;
    --signal:#ff6b70; --signal-soft:#33161a; --signal-ink:#ff8a8e;
    --code-bg:#1b1d2b; --code-ink:#b9bdd8;
  }
}
:root[data-theme="dark"]{
  --paper:#0e0f16; --surface:#161825; --sunken:#1c1e2c;
  --ink:#eceef7; --body:#c4c7d8; --muted:#8b8fa6;
  --rule:#282b3d; --rule-soft:#20222f;
  --brand:#93a0ec; --brand-soft:#1b2040; --brand-ink:#a8b3f2;
  --signal:#ff6b70; --signal-soft:#33161a; --signal-ink:#ff8a8e;
  --code-bg:#1b1d2b; --code-ink:#b9bdd8;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--body);
  font-family:"Source Serif 4","Iowan Old Style",Georgia,serif;
  font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.sans{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

/* ── masthead ─────────────────────────────────────────── */
header.mast{
  border-bottom:1px solid var(--rule);
  background:var(--surface);
  padding:clamp(2rem,5vw,3.25rem) clamp(1.25rem,5vw,3rem) clamp(1.75rem,4vw,2.5rem);
}
.mast-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:1.5rem 3rem;align-items:flex-end;justify-content:space-between}
.mast h1{
  font-family:"IBM Plex Sans",sans-serif; font-weight:600;
  font-size:clamp(1.9rem,4vw,2.9rem); line-height:1.08; letter-spacing:-.022em;
  color:var(--ink); margin:0; text-wrap:balance;
}
.mast .lede{
  margin:.75rem 0 0; max-width:60ch; color:var(--muted); font-size:1.02rem; line-height:1.55;
}
.mark{
  display:inline-flex;align-items:center;gap:.55rem;margin-bottom:1rem;
  font-family:"IBM Plex Sans",sans-serif;font-size:.7rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--brand-ink);
}
.mark i{width:.55rem;height:.55rem;background:var(--signal);border-radius:1px;display:block;transform:rotate(45deg)}
.facts{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.76rem;line-height:1.9;color:var(--muted);
  display:grid;grid-template-columns:auto auto;gap:0 1.1rem;
}
.facts b{color:var(--ink);font-weight:500}

/* ── shell ────────────────────────────────────────────── */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:clamp(2rem,4vw,3.5rem);padding:0 clamp(1.25rem,5vw,3rem) 6rem}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}}

nav.rail{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:2.5rem 0 3rem}
@media(max-width:900px){nav.rail{position:static;max-height:none;padding-bottom:1rem;border-bottom:1px solid var(--rule)}}
nav.rail h2{
  font-family:"IBM Plex Sans",sans-serif;font-size:.66rem;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 1rem;
}
nav.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.1rem}
nav.rail a{
  display:grid;grid-template-columns:1.9rem 1fr;align-items:baseline;
  font-family:"IBM Plex Sans",sans-serif;font-size:.845rem;line-height:1.35;
  text-decoration:none;color:var(--body);padding:.4rem .55rem;border-radius:3px;
  border-left:2px solid transparent;
}
nav.rail a:hover{background:var(--sunken);color:var(--ink)}
nav.rail a .n{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
nav.rail a:hover .n{color:var(--brand-ink)}

/* ── article ──────────────────────────────────────────── */
article{padding-top:2.5rem;min-width:0}
article > p, article > ul, article > ol, article > aside{max-width:68ch}
article p{margin:0 0 1.1rem}
article > h2{
  font-family:"IBM Plex Sans",sans-serif;font-weight:600;color:var(--ink);
  font-size:clamp(1.45rem,2.6vw,1.95rem);line-height:1.15;letter-spacing:-.018em;
  margin:4.25rem 0 1.5rem;padding-top:2.25rem;border-top:1px solid var(--rule);
  display:grid;grid-template-columns:auto 1fr;gap:.85rem;align-items:baseline;text-wrap:balance;
}
article > h2:first-child{margin-top:0;padding-top:0;border-top:0}
.sec-num{
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:500;
  color:var(--brand-ink);background:var(--brand-soft);
  padding:.28rem .5rem;border-radius:3px;font-variant-numeric:tabular-nums;
  transform:translateY(-.15em);
}
article h3{
  font-family:"IBM Plex Sans",sans-serif;font-weight:600;color:var(--ink);
  font-size:1.13rem;line-height:1.3;letter-spacing:-.008em;margin:2.75rem 0 .9rem;text-wrap:balance;
}
article h4{
  font-family:"IBM Plex Sans",sans-serif;font-weight:600;color:var(--ink);
  font-size:.97rem;margin:2rem 0 .7rem;
}
article ul,article ol{margin:0 0 1.2rem;padding-left:1.25rem}
article li{margin-bottom:.45rem}
article li::marker{color:var(--muted)}
strong{color:var(--ink);font-weight:600}
em{color:var(--ink)}
a{color:var(--brand-ink);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--brand) 35%,transparent)}
a:hover{border-bottom-color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:2px}

code{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.845em;background:var(--code-bg);color:var(--code-ink);
  padding:.13em .38em;border-radius:3px;
}
pre{
  background:var(--code-bg);border:1px solid var(--rule-soft);border-radius:5px;
  padding:1rem 1.15rem;overflow-x:auto;margin:0 0 1.4rem;max-width:68ch;
}
pre code{background:none;padding:0;font-size:.8rem;line-height:1.7;color:var(--code-ink)}

/* ── tables ───────────────────────────────────────────── */
.tw{overflow-x:auto;margin:0 0 1.75rem;border:1px solid var(--rule);border-radius:5px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:"IBM Plex Sans",sans-serif;font-size:.855rem;line-height:1.5}
th{
  text-align:left;font-weight:600;color:var(--muted);background:var(--sunken);
  font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.7rem .9rem;border-bottom:1px solid var(--rule);white-space:nowrap;
}
td{padding:.72rem .9rem;border-bottom:1px solid var(--rule-soft);vertical-align:top;color:var(--body)}
tbody tr:last-child td{border-bottom:0}
td:first-child{color:var(--ink);font-weight:500}
td code{font-size:.8em}
th:empty{padding:0}

/* ── callouts ─────────────────────────────────────────── */
aside.callout{
  border-left:2px solid var(--brand);background:var(--brand-soft);
  padding:.95rem 1.15rem;margin:0 0 1.5rem;border-radius:0 4px 4px 0;
}
aside.callout p{margin:0 0 .6rem;font-size:.95rem}
aside.callout p:last-child{margin-bottom:0}
aside.callout code{background:color-mix(in srgb,var(--ink) 7%,transparent)}
aside.danger{border-left-color:var(--signal);background:var(--signal-soft)}
aside.danger strong{color:var(--signal-ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="mast">
  <div class="mast-in">
    <div>
      <div class="mark"><i></i>Inferrix Cortex</div>
      <h1>Feature Guide</h1>
      <p class="lede">Every feature Inferrix has added on top of upstream ThingsBoard &mdash; what it does,
      how to configure it, how it behaves, and where it deliberately differs from ThingsBoard Professional Edition.</p>
    </div>
    <div class="facts">
{{FACTS}}
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail">
    <h2>Contents</h2>
    <ol>
{{NAV}}
</ol>
  </nav>
  <article>
{{ARTICLE}}
</article>
</div>
