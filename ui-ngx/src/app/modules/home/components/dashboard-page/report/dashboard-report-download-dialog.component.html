<form [formGroup]="downloadFormGroup" (ngSubmit)="download()" style="min-width: 400px;">
  <mat-toolbar color="primary">
    <h2>{{ 'report.download' | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button type="button" (click)="cancel()">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <div mat-dialog-content>
    <fieldset class="flex flex-col">
      <mat-form-field class="mat-block">
        <mat-label translate>report.type</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let reportType of reportTypes" [value]="reportType">
            {{ reportType.toUpperCase() }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <tb-timezone-select userTimezoneByDefault
                           formControlName="timezone">
      </tb-timezone-select>
      <mat-form-field class="mat-block">
        <mat-label translate>report.dashboard-state</mat-label>
        <input matInput formControlName="state">
      </mat-form-field>
      <div class="tb-form-panel-title" translate>report.timewindow</div>
      <tb-timewindow asButton
                     strokedButton
                     isEdit="true"
                     timezone="true"
                     aggregation="true"
                     formControlName="timewindow">
      </tb-timewindow>
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex justify-end">
    <button mat-button type="button" (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary" type="submit">
      {{ 'action.download' | translate }}
    </button>
  </div>
</form>
