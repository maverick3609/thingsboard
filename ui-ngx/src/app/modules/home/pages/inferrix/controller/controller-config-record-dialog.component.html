<form [formGroup]="recordForm" (ngSubmit)="save()">
  <mat-toolbar color="primary">
    <h2>{{ (isAdd ? 'inferrix.add-record' : 'inferrix.edit-record') | translate }}
      · {{ section.titleKey | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async">
  </mat-progress-bar>
  <div style="height: 4px;" *ngIf="(isLoading$ | async) === false"></div>
  <div mat-dialog-content>
    <fieldset class="tb-form-panel no-border no-padding" [disabled]="isLoading$ | async">
      <div class="tb-error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
      <ng-container *ngFor="let field of section.fields">
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width" [class.tb-required]="field.required"
               tb-hint-tooltip-icon="{{ field.hint ? (field.hint | translate) : '' }}">{{ field.label | translate }}</div>
          <div *ngIf="field.type === 'flags'" class="flex flex-1 flex-row flex-wrap items-center gap-4">
            <mat-checkbox *ngFor="let bit of field.bits"
                          [checked]="hasBit(field, bit.value)"
                          (change)="setBit(field, bit.value, $event.checked)">
              {{ bit.label | translate }}
            </mat-checkbox>
          </div>
          <mat-form-field *ngIf="field.type === 'select'" class="flex-1" appearance="outline" subscriptSizing="dynamic">
            <mat-select [formControlName]="field.key">
              <mat-option *ngFor="let option of optionsFor(field)" [value]="option.value">
                {{ option.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field *ngIf="field.type === 'text' || field.type === 'number'"
                          class="flex-1" appearance="outline" subscriptSizing="dynamic">
            <input matInput [formControlName]="field.key"
                   [type]="field.type === 'number' ? 'number' : 'text'"
                   [maxlength]="field.maxLength"/>
            <mat-icon matSuffix class="tb-error" matTooltipPosition="above" matTooltipClass="tb-error-tooltip"
                      [matTooltip]="'inferrix.field-invalid' | translate"
                      *ngIf="recordForm.get(field.key).invalid && recordForm.get(field.key).touched">
              warning
            </mat-icon>
          </mat-form-field>
        </div>
        <div *ngIf="field.key === 'flags' && writableOutputWarning" class="tb-form-hint tb-primary-fill flex items-center gap-2">
          <mat-icon>warning</mat-icon>
          <span>{{ writableOutputWarning | translate }}</span>
        </div>
      </ng-container>
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex flex-row items-center justify-end">
    <button mat-button color="primary"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()" cdkFocusInitial>
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || recordForm.invalid">
      {{ 'action.save' | translate }}
    </button>
  </div>
</form>
