<div class="tb-report-sub-report-config flex flex-col gap-2">
  <div class="mat-subtitle-1" translate>report.designer.component-sub-report</div>
  <mat-form-field subscriptSizing="dynamic">
    <mat-label translate>report.designer.sub-report-template</mat-label>
    <input matInput
           type="text"
           [formControl]="templateInput"
           [matAutocomplete]="templateAutocomplete"/>
    <button *ngIf="templateInput.value && !disabled"
            type="button"
            matSuffix mat-icon-button aria-label="Clear"
            (click)="clearTemplate()">
      <mat-icon>close</mat-icon>
    </button>
    <mat-autocomplete #templateAutocomplete="matAutocomplete" [displayWith]="displayTemplateFn">
      <mat-option *ngFor="let template of filteredTemplates | async" [value]="template">
        {{ template.name }}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
  <div class="flex flex-col gap-2" [formGroup]="subFormGroup">
    <mat-checkbox *ngIf="showAvoidPageBreakInside" formControlName="avoidPageBreakInside">{{ 'report.designer.avoid-page-break-inside' | translate }}</mat-checkbox>
    <div class="flex flex-col gap-1">
      <label class="mat-caption" translate>report.designer.data-sources</label>
      <tb-report-datasources [aliasController]="aliasController" formControlName="dataSources"></tb-report-datasources>
    </div>
  </div>
</div>
