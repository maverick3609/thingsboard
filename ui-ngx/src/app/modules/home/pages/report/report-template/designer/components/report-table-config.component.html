<div class="tb-report-table-config flex flex-col gap-2" [formGroup]="formGroup">
  <div class="mat-subtitle-1" *ngIf="isEntityTable" translate>report.designer.component-entity-table</div>
  <div class="mat-subtitle-1" *ngIf="isAlarmTable" translate>report.designer.component-alarm-table</div>
  <div class="mat-subtitle-1" *ngIf="isTimeSeriesTable" translate>report.designer.component-time-series-table</div>
  <tb-report-config-tabs [tabs]="['content', 'data', 'layout']">
    <div tabContent class="flex flex-col gap-2">
      <tb-report-table-settings formControlName="tableSettings"></tb-report-table-settings>
      <ng-container *ngIf="isTimeSeriesTable">
        <mat-checkbox formControlName="showTimestamp">{{ 'report.designer.show-timestamp' | translate }}</mat-checkbox>
        <div class="flex flex-col gap-1">
          <label class="mat-caption" translate>report.designer.timestamp-label</label>
          <mat-form-field subscriptSizing="dynamic">
            <input matInput formControlName="timestampLabel"/>
          </mat-form-field>
        </div>
        <div class="flex flex-col gap-1">
          <label class="mat-caption" translate>report.designer.timestamp-pattern</label>
          <mat-form-field subscriptSizing="dynamic">
            <input matInput formControlName="timestampPattern"/>
          </mat-form-field>
        </div>
      </ng-container>
    </div>
    <div tabData class="flex flex-col gap-2">
      <tb-report-datasources *ngIf="!isAlarmTable"
                              [aliasController]="aliasController"
                              [widgetType]="dataWidgetType"
                              [allowedDataSourceTypes]="tableDataSourceTypes"
                              formControlName="dataSources">
      </tb-report-datasources>
      <ng-container *ngIf="isAlarmTable">
        <tb-report-datasource [aliasController]="aliasController"
                              [widgetType]="widgetTypeEnum.alarm"
                              [showAlarmFilter]="true"
                              [allowedDataSourceTypes]="tableDataSourceTypes"
                              formControlName="alarmSource">
        </tb-report-datasource>
        <div class="mat-caption" translate>report.designer.alarm-assignee-unsupported</div>
      </ng-container>
      <tb-report-timewindow *ngIf="showTimewindow"
                            [aggregation]="isTimeSeriesTable"
                            formControlName="timewindow">
      </tb-report-timewindow>
    </div>
    <div tabLayout class="flex flex-col gap-2">
      <div class="flex flex-col gap-1">
        <label class="mat-caption" translate>report.designer.margins</label>
        <tb-report-insets formControlName="margins"></tb-report-insets>
      </div>
      <div class="flex flex-col gap-1">
        <label class="mat-caption" translate>report.designer.paddings</label>
        <tb-report-insets formControlName="paddings"></tb-report-insets>
      </div>
      <tb-report-background-border formControlName="backgroundBorder"></tb-report-background-border>
    </div>
  </tb-report-config-tabs>
</div>
