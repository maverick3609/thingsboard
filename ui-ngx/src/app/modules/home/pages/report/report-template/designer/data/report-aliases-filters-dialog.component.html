<div style="min-width: 600px;">
  <mat-toolbar color="primary">
    <h2>{{ (mode === 'aliases' ? 'entity.aliases' : 'filter.filters') | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button type="button" (click)="close()">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <div mat-dialog-content>
    <tb-report-entity-aliases *ngIf="mode === 'aliases'" [config]="config"></tb-report-entity-aliases>
    <tb-report-filters *ngIf="mode === 'filters'" [config]="config"></tb-report-filters>
  </div>
  <div mat-dialog-actions class="flex justify-end">
    <button mat-raised-button color="primary" type="button" (click)="close()">
      {{ 'action.close' | translate }}
    </button>
  </div>
</div>
