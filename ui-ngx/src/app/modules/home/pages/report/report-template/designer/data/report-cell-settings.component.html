<div class="tb-report-cell-settings flex flex-col gap-2" [formGroup]="cellFormGroup">
  <tb-report-font formControlName="font"></tb-report-font>
  <!-- report.designer.heading-color/background are reused as-is ("Text color"/"Background") - same
       concept as CellSettings.color/backgroundColor, just first introduced by the heading/
       background-border widgets. -->
  <tb-color-input formControlName="color" colorClearButton
                  label="{{ 'report.designer.heading-color' | translate }}">
  </tb-color-input>
  <tb-color-input formControlName="backgroundColor" colorClearButton
                  label="{{ 'report.designer.background' | translate }}">
  </tb-color-input>
  <tb-report-alignment formControlName="alignment"></tb-report-alignment>
</div>
