<div class="tb-report-column-settings flex flex-col gap-2" [formGroup]="columnFormGroup">
  <mat-form-field subscriptSizing="dynamic">
    <input matInput formControlName="columnWidth"
           placeholder="{{ 'report.designer.column-width' | translate }}"/>
  </mat-form-field>
  <div class="flex flex-col gap-1">
    <label class="mat-caption" translate>report.designer.column-header</label>
    <tb-report-cell-settings formControlName="header"></tb-report-cell-settings>
  </div>
  <div class="flex flex-col gap-1">
    <label class="mat-caption" translate>report.designer.column-cell</label>
    <tb-report-cell-settings formControlName="cell"></tb-report-cell-settings>
  </div>
</div>
