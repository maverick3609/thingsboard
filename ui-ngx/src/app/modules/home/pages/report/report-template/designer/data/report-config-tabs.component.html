<mat-tab-group class="tb-report-config-tabs">
  <mat-tab *ngIf="hasTab('content')" label="{{ 'report.designer.tab-content' | translate }}">
    <div class="tb-report-config-tabs-body">
      <ng-content select="[tabContent]"></ng-content>
    </div>
  </mat-tab>
  <mat-tab *ngIf="hasTab('data')" label="{{ 'report.designer.tab-data' | translate }}">
    <div class="tb-report-config-tabs-body">
      <ng-content select="[tabData]"></ng-content>
    </div>
  </mat-tab>
  <mat-tab *ngIf="hasTab('layout')" label="{{ 'report.designer.tab-layout' | translate }}">
    <div class="tb-report-config-tabs-body">
      <ng-content select="[tabLayout]"></ng-content>
    </div>
  </mat-tab>
</mat-tab-group>
