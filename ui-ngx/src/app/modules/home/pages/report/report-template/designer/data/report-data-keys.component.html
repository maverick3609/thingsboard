<div class="tb-report-data-keys flex flex-col gap-2" [formGroup]="dataKeysFormGroup">
  <tb-data-keys
      formControlName="keys"
      [widgetType]="widgetType"
      [datasourceType]="platformDatasourceType"
      [aliasController]="aliasController"
      [callbacks]="callbacks"
      [entityAliasId]="entityAliasId"
      [deviceId]="deviceId"
      [hideDataKeyColor]="true">
  </tb-data-keys>
  <mat-accordion *ngIf="modelValue?.length" class="tb-report-data-keys-settings" multi>
    <mat-expansion-panel *ngFor="let key of modelValue; let i = index; trackBy: trackByIndex" [disabled]="disabled">
      <mat-expansion-panel-header>
        <mat-panel-title>{{ key.label || key.name || ('report.designer.unnamed-key' | translate) }}</mat-panel-title>
      </mat-expansion-panel-header>
      <tb-report-column-settings
          [ngModel]="key.settings"
          [ngModelOptions]="{standalone: true}"
          [disabled]="disabled"
          (ngModelChange)="onColumnSettingsChange(i, $event)">
      </tb-report-column-settings>
    </mat-expansion-panel>
  </mat-accordion>
</div>
