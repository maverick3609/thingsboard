<div class="tb-report-datasource flex flex-col gap-2" [formGroup]="dsFormGroup">
  <mat-form-field subscriptSizing="dynamic">
    <mat-select formControlName="type" placeholder="{{ 'report.designer.datasource-type' | translate }}">
      <mat-option *ngIf="isTypeAllowed(dataSourceTypeEnum.DEVICE)" [value]="dataSourceTypeEnum.DEVICE">{{ 'report.designer.datasource-type-device' | translate }}</mat-option>
      <mat-option *ngIf="isTypeAllowed(dataSourceTypeEnum.ENTITY)" [value]="dataSourceTypeEnum.ENTITY">{{ 'report.designer.datasource-type-entity' | translate }}</mat-option>
      <mat-option *ngIf="isTypeAllowed(dataSourceTypeEnum.ENTITY_COUNT)" [value]="dataSourceTypeEnum.ENTITY_COUNT">{{ 'report.designer.datasource-type-entity-count' | translate }}</mat-option>
      <mat-option *ngIf="isTypeAllowed(dataSourceTypeEnum.ALARM_COUNT)" [value]="dataSourceTypeEnum.ALARM_COUNT">{{ 'report.designer.datasource-type-alarm-count' | translate }}</mat-option>
    </mat-select>
  </mat-form-field>

  <tb-entity-autocomplete *ngIf="isDevice"
                          [entityType]="entityTypeEnum.DEVICE"
                          appearance="outline"
                          formControlName="deviceId">
  </tb-entity-autocomplete>

  <tb-entity-alias-select *ngIf="showEntityAliasSelect"
                          [showLabel]="true"
                          appearance="outline"
                          [aliasController]="aliasController"
                          formControlName="entityAliasId">
  </tb-entity-alias-select>

  <tb-filter-select *ngIf="showFilterSelect"
                    [showLabel]="true"
                    appearance="outline"
                    [aliasController]="aliasController"
                    formControlName="filterId">
  </tb-filter-select>

  <tb-report-alarm-filter *ngIf="showAlarmFilterControl"
                          formControlName="alarmFilterConfig">
  </tb-report-alarm-filter>

  <div class="flex flex-col gap-1" *ngIf="showDataKeys">
    <label class="mat-caption" translate>report.designer.data-keys</label>
    <tb-report-data-keys
        [dataSourceType]="selectedType"
        [widgetType]="widgetType"
        [aliasController]="aliasController"
        [entityAliasId]="dsFormGroup.get('entityAliasId').value"
        [deviceId]="dsFormGroup.get('deviceId').value"
        formControlName="dataKeys">
    </tb-report-data-keys>
  </div>
  <div class="flex flex-col gap-1" *ngIf="showDataKeys">
    <label class="mat-caption" translate>report.designer.latest-data-keys</label>
    <tb-report-data-keys
        [dataSourceType]="selectedType"
        [widgetType]="widgetTypeEnum.latest"
        [aliasController]="aliasController"
        [entityAliasId]="dsFormGroup.get('entityAliasId').value"
        [deviceId]="dsFormGroup.get('deviceId').value"
        formControlName="latestDataKeys">
    </tb-report-data-keys>
  </div>
</div>
