<div class="tb-report-datasources flex flex-col gap-2">
  <div *ngFor="let control of controls; let i = index; trackBy: trackByIndex"
       class="tb-report-datasource-row flex flex-row items-start gap-1">
    <tb-report-datasource class="flex-1"
                          [formControl]="control"
                          [aliasController]="aliasController"
                          [widgetType]="widgetType"
                          [showAlarmFilter]="showAlarmFilter"
                          [allowedDataSourceTypes]="allowedDataSourceTypes">
    </tb-report-datasource>
    <button type="button"
            mat-icon-button
            [disabled]="disabled"
            (click)="removeDataSource(i)"
            matTooltip="{{ 'report.designer.remove-datasource' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
  <div>
    <button type="button"
            mat-stroked-button
            color="primary"
            [disabled]="disabled"
            (click)="addDataSource()">
      <mat-icon>add</mat-icon>
      <span translate>report.designer.add-datasource</span>
    </button>
  </div>
</div>
