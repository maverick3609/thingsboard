<div class="tb-report-entity-aliases flex flex-col gap-2">
  <div *ngFor="let alias of aliases; trackBy: trackById"
       class="tb-report-entity-alias-row flex flex-row items-center gap-1">
    <span class="flex-1">{{ alias.alias }}</span>
    <button type="button"
            mat-icon-button
            (click)="editAlias(alias)"
            matTooltip="{{ 'alias.edit' | translate }}"
            matTooltipPosition="above">
      <mat-icon>edit</mat-icon>
    </button>
    <button type="button"
            mat-icon-button
            (click)="deleteAlias(alias)"
            matTooltip="{{ 'entity.remove-alias' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
  <div>
    <button type="button"
            mat-stroked-button
            color="primary"
            (click)="addAlias()">
      <mat-icon>add</mat-icon>
      <span translate>alias.add</span>
    </button>
  </div>
</div>
