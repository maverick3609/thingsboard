<div class="tb-report-filters flex flex-col gap-2">
  <div *ngFor="let filter of filters; trackBy: trackById"
       class="tb-report-filter-row flex flex-row items-center gap-1">
    <span class="flex-1">{{ filter.filter }}</span>
    <button type="button"
            mat-icon-button
            (click)="editFilter(filter)"
            matTooltip="{{ 'filter.edit' | translate }}"
            matTooltipPosition="above">
      <mat-icon>edit</mat-icon>
    </button>
    <button type="button"
            mat-icon-button
            (click)="deleteFilter(filter)"
            matTooltip="{{ 'filter.remove-filter' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
  <div>
    <button type="button"
            mat-stroked-button
            color="primary"
            (click)="addFilter()">
      <mat-icon>add</mat-icon>
      <span translate>filter.add</span>
    </button>
  </div>
</div>
