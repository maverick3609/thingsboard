<div class="tb-report-table-settings flex flex-col gap-2" [formGroup]="tableFormGroup">
  <mat-checkbox formControlName="showTableHeading">{{ 'report.designer.show-table-heading' | translate }}</mat-checkbox>
  <div class="flex flex-col gap-2" formGroupName="tableHeading">
    <label class="mat-caption" translate>report.designer.table-heading</label>
    <mat-form-field subscriptSizing="dynamic">
      <input matInput formControlName="text"
             placeholder="{{ 'report.designer.heading-text' | translate }}"/>
    </mat-form-field>
    <tb-report-font formControlName="font"></tb-report-font>
    <tb-color-input formControlName="color" colorClearButton
                    label="{{ 'report.designer.heading-color' | translate }}">
    </tb-color-input>
    <tb-report-alignment formControlName="alignment"></tb-report-alignment>
    <mat-form-field subscriptSizing="dynamic">
      <input matInput type="number" min="0" formControlName="height"
             placeholder="{{ 'report.designer.heading-height' | translate }}"/>
    </mat-form-field>
  </div>
  <div class="flex flex-col gap-2" formGroupName="tableSortOrder">
    <label class="mat-caption" translate>report.designer.table-sort-order</label>
    <mat-form-field subscriptSizing="dynamic">
      <input matInput formControlName="column"
             placeholder="{{ 'report.designer.sort-column' | translate }}"/>
    </mat-form-field>
    <mat-form-field subscriptSizing="dynamic">
      <mat-select formControlName="direction" placeholder="{{ 'report.designer.sort-direction' | translate }}">
        <mat-option [value]="null"></mat-option>
        <mat-option [value]="tableSortDirectionEnum.ASC">{{ 'report.designer.sort-direction-asc' | translate }}</mat-option>
        <mat-option [value]="tableSortDirectionEnum.DESC">{{ 'report.designer.sort-direction-desc' | translate }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
