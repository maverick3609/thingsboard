<div class="tb-report-canvas flex flex-col">
  <div cdkDropList
       [cdkDropListData]="components"
       [cdkDropListEnterPredicate]="paletteOnlyEnterPredicate"
       (cdkDropListDropped)="onDrop($event)"
       class="tb-report-canvas-list tb-drop-list flex flex-1 flex-col gap-2">
    <div *ngIf="!components.length" class="tb-report-canvas-empty flex flex-1 flex-col items-center justify-center">
      <span translate class="tb-prompt">report.designer.canvas-empty</span>
    </div>
    <div *ngFor="let component of components; let i = index; trackBy: trackByComponent"
         class="tb-report-canvas-card tb-draggable flex flex-row items-center gap-2"
         cdkDrag
         [cdkDragData]="component"
         role="button"
         tabindex="0"
         (click)="selectComponent(component)"
         (keyup.enter)="selectComponent(component)">
      <div class="tb-drag-handle flex items-center"
           cdkDragHandle
           matTooltip="{{ 'action.drag' | translate }}"
           matTooltipPosition="above">
        <mat-icon>drag_indicator</mat-icon>
      </div>
      <mat-icon>{{ componentTypeInfo(component)?.icon || 'help_outline' }}</mat-icon>
      <span class="flex-1">{{ (componentTypeInfo(component)?.labelKey || component.type) | translate }}</span>
      <button mat-icon-button type="button"
              (click)="removeComponent(i); $event.stopPropagation()"
              (keyup)="$event.stopPropagation()"
              matTooltip="{{ 'action.delete' | translate }}"
              matTooltipPosition="above">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</div>
