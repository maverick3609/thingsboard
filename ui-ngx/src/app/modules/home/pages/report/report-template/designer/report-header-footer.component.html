<div class="tb-report-header-footer flex flex-col">
  <div class="tb-report-header-footer-toolbar flex flex-row items-center gap-2">
    <tb-toggle-select appearance="fill" [(ngModel)]="variant">
      <tb-toggle-option value="main">{{ (header ? 'report.designer.header' : 'report.designer.footer') | translate }}</tb-toggle-option>
      <tb-toggle-option value="firstPage">{{ (header ? 'report.designer.first-page-header' : 'report.designer.first-page-footer') | translate }}</tb-toggle-option>
    </tb-toggle-select>
    <span class="flex-1"></span>
    <button mat-stroked-button type="button" (click)="expanded = !expanded">
      <span>{{ (expanded ? 'report.designer.collapse' : 'report.designer.expand') | translate }}</span>
      <mat-icon>{{ expanded ? 'expand_less' : 'expand_more' }}</mat-icon>
    </button>
    <button mat-stroked-button type="button" [disabled]="disabled" (click)="toggleEnabled()">
      <mat-icon>{{ current.enabled ? 'block' : 'check' }}</mat-icon>
      <span>{{ (current.enabled ? 'report.designer.disable' : 'report.designer.enable') | translate }}</span>
    </button>
  </div>
  <ng-container *ngIf="expanded">
    <tb-report-canvas *ngIf="current.enabled"
                       class="tb-report-header-footer-canvas"
                       [components]="current.components"
                       (componentsChange)="onComponentsChange($event)"
                       (selected)="componentSelected.emit($event)">
    </tb-report-canvas>
    <div *ngIf="!current.enabled" class="tb-report-header-footer-disabled tb-prompt">{{ disabledKey | translate }}</div>
  </ng-container>
</div>
