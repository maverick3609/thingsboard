<div class="tb-report-header-footer flex flex-col gap-2">
  <div class="tb-report-header-footer-toggles flex flex-col gap-1" [formGroup]="toggleFormGroup">
    <div class="flex items-center justify-between">
      <span translate>report.designer.enabled</span>
      <mat-slide-toggle formControlName="enabled"></mat-slide-toggle>
    </div>
    <div class="flex items-center justify-between" *ngIf="allowFirstPage">
      <span translate>report.designer.different-first-page</span>
      <mat-slide-toggle formControlName="firstPageEnabled"></mat-slide-toggle>
    </div>
  </div>
  <tb-report-canvas *ngIf="toggleFormGroup.get('enabled').value"
                     [components]="value.components"
                     (componentsChange)="onComponentsChange($event)"
                     (selected)="reEmitSelection($event)">
  </tb-report-canvas>
  <tb-report-header-footer *ngIf="allowFirstPage && toggleFormGroup.get('firstPageEnabled').value"
                            class="tb-report-header-footer-first-page"
                            [allowFirstPage]="false"
                            [ngModel]="value.firstPage"
                            (ngModelChange)="onFirstPageChange($event)"
                            (componentSelected)="reEmitSelection($event)"
                            (componentsChanged)="componentsChanged.emit()">
  </tb-report-header-footer>
</div>
