<div class="tb-report-page-settings flex flex-col gap-2" [formGroup]="pageSettingsFormGroup">
  <mat-form-field subscriptSizing="dynamic">
    <mat-select formControlName="pageSize" placeholder="{{ 'report.designer.page-size' | translate }}">
      <mat-option *ngFor="let size of pageSizes" [value]="size">{{ size }} ({{ dimensionsLabel(size) }})</mat-option>
    </mat-select>
    <mat-hint>{{ dimensionsLabel(pageSettingsFormGroup.get('pageSize').value) }}</mat-hint>
  </mat-form-field>
  <div class="flex flex-col gap-1">
    <label class="mat-caption" translate>report.designer.page-orientation</label>
    <mat-button-toggle-group formControlName="pageOrientation">
      <mat-button-toggle [value]="pageOrientationEnum.PORTRAIT" translate>report.designer.portrait</mat-button-toggle>
      <mat-button-toggle [value]="pageOrientationEnum.LANDSCAPE" translate>report.designer.landscape</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  <div class="flex flex-col gap-1">
    <label class="mat-caption" translate>report.designer.page-margins</label>
    <tb-report-insets formControlName="pageMargins"></tb-report-insets>
  </div>
  <tb-color-input formControlName="pageBackground" colorClearButton
                  label="{{ 'report.designer.background' | translate }}">
  </tb-color-input>
  <mat-form-field subscriptSizing="dynamic">
    <input matInput formControlName="namePattern" placeholder="{{ 'report.name-pattern' | translate }}"/>
  </mat-form-field>
  <mat-form-field subscriptSizing="dynamic">
    <input matInput formControlName="timeDataPattern" placeholder="{{ 'report.designer.time-data-pattern' | translate }}"/>
  </mat-form-field>
  <mat-accordion *ngIf="config" class="tb-report-manage-aliases-filters" multi>
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title translate>report.designer.manage-aliases</mat-panel-title>
      </mat-expansion-panel-header>
      <tb-report-entity-aliases [config]="config"></tb-report-entity-aliases>
    </mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title translate>report.designer.manage-filters</mat-panel-title>
      </mat-expansion-panel-header>
      <tb-report-filters [config]="config"></tb-report-filters>
    </mat-expansion-panel>
  </mat-accordion>
</div>
