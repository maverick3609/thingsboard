<div class="tb-report-palette flex flex-col gap-2 p-2">
  <div class="tb-form-panel-title" translate>report.designer.components</div>
  <div cdkDropList
       [cdkDropListSortingDisabled]="true"
       [cdkDropListData]="paletteItems"
       [cdkDropListEnterPredicate]="noEnterPredicate"
       class="tb-report-palette-list tb-drop-list flex flex-col gap-1">
    <div *ngFor="let item of paletteItems"
         class="tb-report-palette-item tb-draggable flex flex-row items-center gap-2 p-2"
         style="cursor: move;"
         cdkDrag
         [cdkDragData]="item.type">
      <img [src]="item.preview" [alt]="item.labelKey | translate" class="tb-report-palette-preview">
      <span>{{ item.labelKey | translate }}</span>
    </div>
  </div>
</div>
