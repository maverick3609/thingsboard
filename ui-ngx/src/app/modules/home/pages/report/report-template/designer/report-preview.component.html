<div class="tb-report-preview-toolbar flex flex-row items-center gap-2">
  <button mat-icon-button type="button"
          [disabled]="loading"
          (click)="refresh()"
          matTooltip="{{ 'report.designer.preview-refresh' | translate }}"
          matTooltipPosition="above">
    <mat-icon>refresh</mat-icon>
  </button>
</div>
<div class="tb-report-preview-body flex flex-1 flex-col items-center justify-center">
  <object *ngIf="previewUrl" [data]="previewUrl" type="application/pdf" class="tb-report-preview-object"></object>
  <mat-progress-spinner *ngIf="loading && !previewUrl" diameter="40" mode="indeterminate"></mat-progress-spinner>
  <span *ngIf="!loading && !previewUrl && failed" class="tb-prompt">{{ errorMessage || ('report.designer.preview-error' | translate) }}</span>
  <span *ngIf="!loading && !previewUrl && !failed" class="tb-prompt" translate>report.designer.preview-empty</span>
</div>
