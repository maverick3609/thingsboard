<div class="tb-report-template-editor flex flex-1 flex-col" *ngIf="reportTemplate"
     tb-fullscreen
     [fullscreen]="isFullscreen">
  <mat-toolbar class="mat-elevation-z1 tb-report-template-editor-toolbar gap-4 lt-xl:gap-2">
    <button mat-icon-button
            matTooltip="{{ 'action.back' | translate }}"
            matTooltipPosition="above"
            (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="tb-report-template-title">{{ reportTemplate.name }} - {{ reportTemplate.format }}</span>
    <span class="flex-1"></span>
    <button mat-button type="button" (click)="deselect()">
      <mat-icon>settings</mat-icon>
      <span>{{ 'report.designer.settings' | translate }}</span>
    </button>
    <button mat-button type="button" (click)="openAliases()">
      <mat-icon>view_quilt</mat-icon>
      <span>{{ 'entity.aliases-short' | translate }}</span>
    </button>
    <button mat-button type="button" (click)="openFilters()">
      <mat-icon>filter_list</mat-icon>
      <span>{{ 'filter.filters' | translate }}</span>
    </button>
    <tb-toggle-select appearance="fill"
                       fillHeight
                       extraPadding
                       primaryBackground
                       [(ngModel)]="viewMode">
      <tb-toggle-option value="edit">{{ 'action.edit' | translate }}</tb-toggle-option>
      <tb-toggle-option value="preview">{{ 'report.preview' | translate }}</tb-toggle-option>
    </tb-toggle-select>
    <button mat-icon-button
            type="button"
            (click)="exportTemplate()"
            matTooltip="{{ 'report.designer.export' | translate }}"
            matTooltipPosition="above">
      <mat-icon>file_download</mat-icon>
    </button>
    <input #importFileInput
           type="file"
           accept=".json,application/json"
           style="display: none"
           (change)="importTemplate(importFileInput.files[0]); importFileInput.value = ''"/>
    <button mat-icon-button
            type="button"
            (click)="importFileInput.click()"
            matTooltip="{{ 'report.designer.import' | translate }}"
            matTooltipPosition="above">
      <mat-icon>file_upload</mat-icon>
    </button>
    <button mat-button
            type="button"
            [disabled]="!isDirty"
            (click)="decline()">
      <mat-icon>close</mat-icon>
      <span translate>action.decline</span>
    </button>
    <button mat-raised-button color="primary"
            [disabled]="!isDirty || !reportTemplate.name?.trim()"
            (click)="save()">
      <mat-icon>check</mat-icon>
      <span translate>action.save</span>
    </button>
    <button mat-icon-button
            type="button"
            (click)="isFullscreen = !isFullscreen"
            matTooltip="{{ (isFullscreen ? 'fullscreen.exit' : 'fullscreen.expand') | translate }}"
            matTooltipPosition="above">
      <mat-icon>{{ isFullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
    </button>
  </mat-toolbar>
  <div class="tb-report-template-editor-body flex flex-1 flex-row" cdkDropListGroup *ngIf="viewMode === 'edit'">
    <div class="tb-report-template-editor-palette">
      <tb-report-palette [format]="config?.format"></tb-report-palette>
    </div>
    <div class="tb-report-template-editor-canvas flex flex-1 flex-col">
      <tb-report-header-footer *ngIf="showHeaderFooter"
                                [header]="true"
                                [ngModel]="header"
                                (ngModelChange)="onHeaderFooterChange(true, $event)"
                                (componentSelected)="onComponentSelected($event)"
                                (componentsChanged)="onHeaderFooterComponentsChanged()">
      </tb-report-header-footer>
      <div class="tb-report-template-editor-content-title" translate>report.designer.content</div>
      <tb-report-canvas class="flex-1"
                         [components]="config.components"
                         (componentsChange)="onComponentsChange($event)"
                         (selected)="onComponentSelected($event)">
      </tb-report-canvas>
      <tb-report-header-footer *ngIf="showHeaderFooter"
                                [header]="false"
                                [ngModel]="footer"
                                (ngModelChange)="onHeaderFooterChange(false, $event)"
                                (componentSelected)="onComponentSelected($event)"
                                (componentsChanged)="onHeaderFooterComponentsChanged()">
      </tb-report-header-footer>
    </div>
    <div class="tb-report-template-editor-config">
      <button mat-icon-button
              type="button"
              *ngIf="selected"
              (click)="deselect()"
              matTooltip="{{ 'report.designer.back-to-page-settings' | translate }}"
              matTooltipPosition="above">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <tb-report-page-settings *ngIf="selected === null && pageSettings"
                                [ngModel]="pageSettings"
                                (ngModelChange)="onPageSettingsChange($event)"
                                [reportTemplate]="reportTemplate"
                                (templateChanged)="markDirty()">
      </tb-report-page-settings>
      <tb-report-page-break-config *ngIf="selected?.type === 'PAGE_BREAK'">
      </tb-report-page-break-config>
      <tb-report-divider-config *ngIf="selected?.type === 'DIVIDER'"
                                 [ngModel]="selected"
                                 (ngModelChange)="onComponentChange($event)">
      </tb-report-divider-config>
      <tb-report-heading-config *ngIf="selected?.type === 'HEADING'"
                                 [ngModel]="selected"
                                 (ngModelChange)="onComponentChange($event)">
      </tb-report-heading-config>
      <tb-report-rich-text-config *ngIf="selected?.type === 'RICH_TEXT'"
                                   [ngModel]="selected"
                                   (ngModelChange)="onComponentChange($event)">
      </tb-report-rich-text-config>
      <tb-report-image-config *ngIf="selected?.type === 'IMAGE'"
                               [aliasController]="aliasController"
                               [ngModel]="selected"
                               (ngModelChange)="onComponentChange($event)">
      </tb-report-image-config>
      <tb-report-table-config *ngIf="selected?.type === 'ENTITY_TABLE' || selected?.type === 'ALARM_TABLE' || selected?.type === 'TIME_SERIES_TABLE'"
                               [componentType]="selected.type"
                               [aliasController]="aliasController"
                               [ngModel]="selected"
                               (ngModelChange)="onComponentChange($event)">
      </tb-report-table-config>
      <tb-report-sub-report-config *ngIf="selected?.type === 'SUB_REPORT'"
                                    [format]="config.format"
                                    [currentTemplateId]="reportTemplateId"
                                    [aliasController]="aliasController"
                                    [ngModel]="selected"
                                    (ngModelChange)="onComponentChange($event)">
      </tb-report-sub-report-config>
      <tb-report-dashboard-config *ngIf="selected?.type === 'DASHBOARD'"
                                   [aliasController]="aliasController"
                                   [ngModel]="selected"
                                   (ngModelChange)="onComponentChange($event)">
      </tb-report-dashboard-config>
      <div *ngIf="selected && !hasConfigPanel(selected.type)" class="tb-report-config-placeholder tb-prompt" translate>report.designer.component-not-configurable</div>
    </div>
  </div>
  <tb-report-preview *ngIf="viewMode === 'preview'" class="flex-1" [config]="config"></tb-report-preview>
</div>
