<div class="tb-report-template-editor flex flex-1 flex-col" *ngIf="reportTemplate">
  <mat-toolbar class="mat-elevation-z1 tb-report-template-editor-toolbar gap-4 lt-xl:gap-2">
    <button mat-icon-button
            matTooltip="{{ 'action.back' | translate }}"
            matTooltipPosition="above"
            (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <mat-form-field class="tb-report-template-name tb-appearance-transparent">
      <input matInput required maxlength="255"
             [(ngModel)]="reportTemplate.name"
             placeholder="{{ 'report.name' | translate }}"/>
    </mat-form-field>
    <span class="flex-1"></span>
    <tb-toggle-select appearance="fill"
                       fillHeight
                       extraPadding
                       primaryBackground
                       [(ngModel)]="viewMode">
      <tb-toggle-option value="edit">{{ 'action.edit' | translate }}</tb-toggle-option>
      <tb-toggle-option value="preview">{{ 'report.preview' | translate }}</tb-toggle-option>
    </tb-toggle-select>
    <button mat-raised-button color="primary"
            [disabled]="!reportTemplate.name?.trim()"
            (click)="save()"
            matTooltip="{{ 'action.save' | translate }}"
            matTooltipPosition="above">
      <mat-icon>save</mat-icon>
      <span translate>action.save</span>
    </button>
  </mat-toolbar>
  <div class="tb-report-template-editor-body flex flex-1 flex-row">
    <div class="tb-report-template-editor-palette"></div>
    <div class="tb-report-template-editor-canvas flex-1"></div>
    <div class="tb-report-template-editor-config">
      <tb-report-page-settings *ngIf="selected === null && pageSettings"
                                [ngModel]="pageSettings"
                                (ngModelChange)="onPageSettingsChange($event)">
      </tb-report-page-settings>
    </div>
  </div>
</div>
