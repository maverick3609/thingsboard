<div class="tb-report-alignment flex flex-row items-start gap-4" [formGroup]="alignmentFormGroup">
  <div class="flex flex-col gap-1">
    <label class="mat-caption" translate>report.designer.text-alignment</label>
    <mat-button-toggle-group formControlName="textAlignment">
      <mat-button-toggle [value]="textAlignmentEnum.LEFT" matTooltip="{{ 'report.designer.align-left' | translate }}">
        <mat-icon>format_align_left</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle [value]="textAlignmentEnum.CENTER" matTooltip="{{ 'report.designer.align-center' | translate }}">
        <mat-icon>format_align_center</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle [value]="textAlignmentEnum.RIGHT" matTooltip="{{ 'report.designer.align-right' | translate }}">
        <mat-icon>format_align_right</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle [value]="textAlignmentEnum.JUSTIFY" matTooltip="{{ 'report.designer.align-justify' | translate }}">
        <mat-icon>format_align_justify</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  <div class="flex flex-col gap-1">
    <label class="mat-caption" translate>report.designer.vertical-alignment</label>
    <mat-button-toggle-group formControlName="verticalAlignment">
      <mat-button-toggle [value]="verticalAlignmentEnum.TOP" matTooltip="{{ 'report.designer.align-top' | translate }}">
        <mat-icon>vertical_align_top</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle [value]="verticalAlignmentEnum.MIDDLE" matTooltip="{{ 'report.designer.align-middle' | translate }}">
        <mat-icon>vertical_align_center</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle [value]="verticalAlignmentEnum.BOTTOM" matTooltip="{{ 'report.designer.align-bottom' | translate }}">
        <mat-icon>vertical_align_bottom</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</div>
