<div class="tb-report-background-border flex flex-row items-center gap-2" [formGroup]="backgroundBorderFormGroup">
  <tb-color-input class="flex-1" formControlName="background" colorClearButton
                  label="{{ 'report.designer.background' | translate }}">
  </tb-color-input>
  <mat-form-field class="flex-1" subscriptSizing="dynamic">
    <input matInput type="number" min="0" formControlName="borderWidth"
           placeholder="{{ 'report.designer.border-width' | translate }}"/>
  </mat-form-field>
  <mat-form-field class="flex-1" subscriptSizing="dynamic">
    <input matInput type="number" min="0" formControlName="borderRadius"
           placeholder="{{ 'report.designer.border-radius' | translate }}"/>
  </mat-form-field>
  <tb-color-input class="flex-1" formControlName="borderColor" colorClearButton
                  label="{{ 'report.designer.border-color' | translate }}">
  </tb-color-input>
</div>
