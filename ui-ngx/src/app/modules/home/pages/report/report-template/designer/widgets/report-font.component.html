<div class="tb-report-font flex flex-row items-center gap-2" [formGroup]="fontFormGroup">
  <mat-form-field class="flex-1" subscriptSizing="dynamic">
    <input matInput type="number" min="0" formControlName="size"
           placeholder="{{ 'report.designer.font-size' | translate }}"/>
  </mat-form-field>
  <mat-form-field class="flex-1" subscriptSizing="dynamic">
    <mat-select formControlName="weight" placeholder="{{ 'report.designer.font-weight' | translate }}">
      <mat-option [value]="null"></mat-option>
      <mat-option *ngFor="let weight of fontWeights" [value]="weight">{{ weight | titlecase }}</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field class="flex-1" subscriptSizing="dynamic">
    <mat-select formControlName="style" placeholder="{{ 'report.designer.font-style' | translate }}">
      <mat-option [value]="null"></mat-option>
      <mat-option *ngFor="let style of fontStyles" [value]="style">{{ style | titlecase }}</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field class="flex-1" subscriptSizing="dynamic">
    <mat-select formControlName="family" placeholder="{{ 'report.designer.font-family' | translate }}">
      <mat-option [value]="null"></mat-option>
      <mat-option *ngFor="let family of fontFamilies" [value]="family">{{ family }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>
