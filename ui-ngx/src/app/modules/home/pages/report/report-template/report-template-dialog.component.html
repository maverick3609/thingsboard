<form [formGroup]="reportTemplateFormGroup" (ngSubmit)="save()" style="min-width: 600px;">
  <mat-toolbar color="primary">
    <h2>{{ (isAdd ? 'report.add-report-template' : 'report.edit-report-template') | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button type="button" (click)="cancel()">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async"></mat-progress-bar>
  <div mat-dialog-content>
    <div class="flex flex-col gap-4">
      <mat-form-field class="mat-block" subscriptSizing="dynamic">
        <mat-label translate>report.name</mat-label>
        <input matInput formControlName="name" required>
        <mat-error *ngIf="reportTemplateFormGroup.get('name').hasError('required')">
          {{ 'report.name-required' | translate }}
        </mat-error>
      </mat-form-field>
      <div class="tb-form-row">
        <div class="min-w-44" translate>report.format</div>
        <tb-toggle-select formControlName="format">
          <tb-toggle-option [value]="reportFormats.PDF">PDF</tb-toggle-option>
          <tb-toggle-option [value]="reportFormats.CSV">CSV</tb-toggle-option>
        </tb-toggle-select>
      </div>
      <div class="tb-form-row">
        <div class="min-w-44" translate>report.template-type</div>
        <tb-toggle-select formControlName="type">
          <tb-toggle-option [value]="reportTemplateTypes.REPORT">{{ 'report.type-report' | translate }}</tb-toggle-option>
          <tb-toggle-option [value]="reportTemplateTypes.SUB_REPORT">{{ 'report.type-sub-report' | translate }}</tb-toggle-option>
        </tb-toggle-select>
      </div>
      <mat-form-field class="mat-block" subscriptSizing="dynamic">
        <mat-label translate>report.description</mat-label>
        <textarea matInput formControlName="description" rows="2"></textarea>
      </mat-form-field>
    </div>
  </div>
  <div mat-dialog-actions class="flex justify-end">
    <button mat-button type="button" [disabled]="isLoading$ | async" (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary" type="submit"
            [disabled]="(isLoading$ | async) || reportTemplateFormGroup.invalid">
      {{ (isAdd ? 'action.add' : 'action.save') | translate }}
    </button>
  </div>
</form>
