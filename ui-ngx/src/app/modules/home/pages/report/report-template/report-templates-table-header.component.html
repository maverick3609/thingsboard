<button mat-stroked-button color="primary" [matMenuTriggerFor]="templatesFilterMenu">
  <mat-icon>filter_list</mat-icon>
  <span translate>report.templates-filter</span>
</button>
<mat-menu #templatesFilterMenu="matMenu" class="tb-report-templates-filter-menu">
  <div class="tb-form-panel-title" translate>report.template-type</div>
  <button mat-menu-item *ngFor="let type of reportTemplateTypes" (click)="toggleType($event, type)">
    <mat-checkbox [checked]="isTypeSelected(type)" (click)="$event.preventDefault()">
      {{ typeTranslations.get(type) | translate }}
    </mat-checkbox>
  </button>
  <div class="tb-form-panel-title" translate>report.format</div>
  <button mat-menu-item *ngFor="let format of reportFormats" (click)="toggleFormat($event, format)">
    <mat-checkbox [checked]="isFormatSelected(format)" (click)="$event.preventDefault()">{{ format }}</mat-checkbox>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item [disabled]="!filterSet" (click)="reset($event)">
    <mat-icon>replay</mat-icon>
    <span translate>action.reset</span>
  </button>
</mat-menu>
