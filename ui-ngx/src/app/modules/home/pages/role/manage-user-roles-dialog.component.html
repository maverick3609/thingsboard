<form [formGroup]="rolesFormGroup" (ngSubmit)="save()" style="min-width: 480px;">
  <mat-toolbar color="primary">
    <h2>{{ 'role.manage-user-roles' | translate: {email: data.user.email} }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button type="button" (click)="cancel()">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <mat-progress-bar color="warn" mode="indeterminate" *ngIf="(isLoading$ | async) || !loaded"></mat-progress-bar>
  <div mat-dialog-content>
    <div class="tb-hint" translate>role.manage-user-roles-hint</div>
    <mat-form-field class="mat-block">
      <mat-label translate>role.assigned-roles</mat-label>
      <mat-select formControlName="roleIds" multiple>
        <mat-option *ngFor="let role of allRoles" [value]="role.id.id">
          {{ role.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <div class="tb-hint" *ngIf="loaded && !allRoles.length" translate>role.no-roles-defined</div>
  </div>
  <div mat-dialog-actions class="flex justify-end">
    <button mat-button type="button" [disabled]="isLoading$ | async" (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary" type="submit" [disabled]="(isLoading$ | async) || !loaded">
      {{ 'action.save' | translate }}
    </button>
  </div>
</form>
