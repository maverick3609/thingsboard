<form [formGroup]="form" class="wl-settings-form">
  <section>
    <h3>{{ label }}</h3>
    <p class="hint">Enter HTML content that will be displayed to users.</p>
    <mat-form-field class="full-width">
      <mat-label>{{ label }} (HTML)</mat-label>
      <textarea matInput formControlName="content" rows="16" placeholder="<h1>{{ label }}</h1><p>Enter your content here...</p>"></textarea>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="onSave()" type="button">
      <mat-icon>save</mat-icon> Save {{ label }}
    </button>
  </section>
</form>
