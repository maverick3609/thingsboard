<form [formGroup]="form" class="wl-settings-form">
  <section>
    <h3 translate>white-labeling.login-page-settings</h3>
    <div class="form-row">
      <label translate>white-labeling.logo-image</label>
      <!--
        BUG 5 (image gallery picker): this login logo renders on the pre-auth /login page
        (LoginComponent.ngOnInit fetches it via the anonymous GET
        /api/noauth/whiteLabel/loginWhiteLabelParams and binds it into a raw <tb-logo> <img>).
        tb-wl-image-input therefore stores the picked image's public link
        (/api/images/public/{key}, allow-listed + served anonymously by
        ImageController#downloadPublicImage), NOT the gated tb-image; reference, so a logged-out
        browser can fetch it.
      -->
      <tb-wl-image-input formControlName="logoImageUrl"></tb-wl-image-input>
    </div>
    <mat-form-field class="full-width">
      <mat-label translate>white-labeling.logo-image-height</mat-label>
      <input matInput type="number" formControlName="logoImageHeight">
    </mat-form-field>
    <div class="form-row">
      <label translate>white-labeling.login-card-color</label>
      <tb-color-input asBoxInput colorClearButton formControlName="loginCardColor"></tb-color-input>
    </div>
    <div class="form-row">
      <label translate>white-labeling.page-background-color</label>
      <tb-color-input asBoxInput colorClearButton formControlName="pageBackgroundColor"></tb-color-input>
    </div>
    <mat-slide-toggle formControlName="darkForeground">{{ 'white-labeling.dark-foreground' | translate }}</mat-slide-toggle>
    <mat-slide-toggle formControlName="showNameBottom">{{ 'white-labeling.show-name-bottom' | translate }}</mat-slide-toggle>
    <mat-form-field class="full-width">
      <mat-label translate>white-labeling.base-url</mat-label>
      <input matInput formControlName="baseUrl" placeholder="https://example.com">
      <mat-error *ngIf="form.get('baseUrl').hasError('pattern')" translate>white-labeling.base-url-invalid</mat-error>
    </mat-form-field>
  </section>
</form>
