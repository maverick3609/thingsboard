<div class="white-labeling-page">
  <div class="toolbar">
    <h2>White Labeling</h2>
    <span class="spacer"></span>
    <button mat-button color="warn" (click)="deleteSettings()" [disabled]="loading" type="button">
      <mat-icon>delete</mat-icon> Delete
    </button>
    <button mat-button (click)="preview()" [disabled]="loading" type="button">
      <mat-icon>visibility</mat-icon> Preview
    </button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="loading" type="button">
      <mat-icon>save</mat-icon> Save
    </button>
  </div>

  <div *ngIf="isTenantAdmin" class="scope-selector">
    <mat-slide-toggle [checked]="isCustomerScope" (change)="toggleCustomerScope()">
      Edit Customer Settings
    </mat-slide-toggle>
    <mat-form-field *ngIf="isCustomerScope" class="customer-select">
      <mat-label>Customer ID</mat-label>
      <input matInput [(ngModel)]="selectedCustomerId" (blur)="loadParams()">
    </mat-form-field>
  </div>

  <mat-tab-group *ngIf="!loading">
    <mat-tab label="General">
      <tb-general-wl-settings
        [params]="generalParams"
        (paramsChange)="onGeneralParamsChange($event)">
      </tb-general-wl-settings>
    </mat-tab>
    <mat-tab label="Login Page">
      <tb-login-wl-settings
        [params]="loginParams"
        (paramsChange)="onLoginParamsChange($event)">
      </tb-login-wl-settings>
    </mat-tab>
    <mat-tab *ngIf="canEditLegal" label="Privacy Policy">
      <tb-legal-content
        [content]="privacyPolicy"
        [label]="'Privacy Policy'"
        (contentChange)="privacyPolicy = $event"
        (save)="savePrivacyPolicy()">
      </tb-legal-content>
    </mat-tab>
    <mat-tab *ngIf="canEditLegal" label="Terms of Use">
      <tb-legal-content
        [content]="termsOfUse"
        [label]="'Terms of Use'"
        (contentChange)="termsOfUse = $event"
        (save)="saveTermsOfUse()">
      </tb-legal-content>
    </mat-tab>
  </mat-tab-group>

  <mat-spinner *ngIf="loading" diameter="40" class="loading-spinner"></mat-spinner>
</div>
