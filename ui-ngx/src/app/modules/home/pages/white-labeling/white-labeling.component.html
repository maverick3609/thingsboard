<mat-card appearance="outlined" class="settings-card">
  <mat-card-header>
    <mat-card-title>
      <div class="flex flex-row">
        <span class="mat-headline-5" translate>white-labeling.white-labeling</span>
      </div>
    </mat-card-title>
  </mat-card-header>
  <mat-progress-bar color="warn" mode="indeterminate" *ngIf="loading">
  </mat-progress-bar>
  <div style="height: 4px;" *ngIf="!loading"></div>
  <mat-card-content>
    <div *ngIf="isTenantAdmin" class="scope-selector">
      <mat-slide-toggle [checked]="isCustomerScope" (change)="toggleCustomerScope()">
        {{ 'white-labeling.edit-customer-settings' | translate }}
      </mat-slide-toggle>
      <tb-entity-autocomplete *ngIf="isCustomerScope"
                              class="customer-select"
                              [entityType]="entityType.CUSTOMER"
                              [labelText]="'white-labeling.customer' | translate"
                              [(ngModel)]="selectedCustomerId"
                              (ngModelChange)="loadParams()">
      </tb-entity-autocomplete>
    </div>

    <mat-tab-group *ngIf="!loading">
      <mat-tab label="{{ 'white-labeling.general' | translate }}">
        <tb-general-wl-settings
          [params]="generalParams"
          (paramsChange)="onGeneralParamsChange($event)">
        </tb-general-wl-settings>
        <div class="wl-actions">
          <button mat-button color="warn" type="button" [disabled]="loading" (click)="resetSettings('GENERAL')">
            <mat-icon>settings_backup_restore</mat-icon>
            {{ 'white-labeling.reset-to-default' | translate }}
          </button>
          <span class="flex-1"></span>
          <button mat-button color="primary" type="button" [disabled]="loading" (click)="preview()">
            {{ 'white-labeling.preview' | translate }}
          </button>
          <button mat-raised-button color="primary" type="button"
                  [disabled]="loading || !generalDirty" (click)="saveGeneral()">
            {{ 'action.save' | translate }}
          </button>
        </div>
      </mat-tab>
      <mat-tab label="{{ 'white-labeling.login-page' | translate }}">
        <tb-login-wl-settings
          [params]="loginParams"
          (paramsChange)="onLoginParamsChange($event)">
        </tb-login-wl-settings>
        <div class="wl-actions">
          <button mat-button color="warn" type="button" [disabled]="loading" (click)="resetSettings('LOGIN')">
            <mat-icon>settings_backup_restore</mat-icon>
            {{ 'white-labeling.reset-to-default' | translate }}
          </button>
          <span class="flex-1"></span>
          <button mat-raised-button color="primary" type="button"
                  [disabled]="loading || !loginDirty" (click)="saveLogin()">
            {{ 'action.save' | translate }}
          </button>
        </div>
      </mat-tab>
      <mat-tab *ngIf="isSysAdmin" label="{{ 'white-labeling.mail-templates' | translate }}">
        <tb-mail-templates></tb-mail-templates>
      </mat-tab>
      <mat-tab *ngIf="canEditLegal" label="{{ 'white-labeling.privacy-policy' | translate }}">
        <tb-legal-content
          [content]="privacyPolicy"
          [label]="'white-labeling.privacy-policy' | translate"
          (contentChange)="privacyPolicy = $event"
          (save)="savePrivacyPolicy()">
        </tb-legal-content>
      </mat-tab>
      <mat-tab *ngIf="canEditLegal" label="{{ 'white-labeling.terms-of-use' | translate }}">
        <tb-legal-content
          [content]="termsOfUse"
          [label]="'white-labeling.terms-of-use' | translate"
          (contentChange)="termsOfUse = $event"
          (save)="saveTermsOfUse()">
        </tb-legal-content>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
